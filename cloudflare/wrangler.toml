name = "crean-tablero"
main = "src/index.js"
compatibility_date = "2025-06-01"

# El Worker sirve /api/* y delega todo lo demás a los archivos estáticos.
[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "crean"
# Lo imprime `wrangler d1 create crean`. Sin esto el deploy falla.
database_id = "PEGAR_AQUI_EL_ID_QUE_IMPRIME_WRANGLER"

[observability]
enabled = true
